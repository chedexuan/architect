# The bus row: one GROUP of machines covering a LIST of recipes. The three words are the three orders
# the group can take the list in, and the target is the number the shortage order subtracts the lane's
# own output chests from.
form-bus=Bus group
form-bus-tip=One lane of machines covering a LIST of recipes instead of one product: each machine takes its recipe off a shared wire, so the group covers several things. The card is frozen like any other and laid into the box you drew.
form-bus-mode-tip=split: machine i builds candidate i, so the list is covered at once. rotate: every machine re-picks at random on an interval, so the list is covered over time. shortage: the order is not yours at all -- each candidate's count is what the lane's output chests are MISSING against the target, and the machine whose shelf is empty goes first.
bus-split=Split (the list, at once)
bus-rotate=Rotate (over time)
bus-shortage=Shortage (what the shelves miss)
form-bus-target=target
form-bus-target-tip=Only 缺货优先 reads this: the number of items a shelf has to be holding before the line stops being asked to make it. It is a count, not a rate -- one minute of output is the usual way to get one.
form-bus-each=machines each
form-bus-each-tip=How many machines every included candidate gets. A mix is whole machines: two on gear and one on cable is a 2:1 output, and a share of a recipe is not something the engine has been measured to weigh.
form-bus-cand-tip=recipe __1__
bus-no-candidates=This machine can craft nothing a belt lane could carry -- pick an assembler in the machine row (or leave it on auto with one unlocked), and the candidates appear below.
bus-more-hidden=__1__ more recipes this machine can run are not shown -- name them from the plan or lower the machine's scope.
bus-preview=Check the group
form-bus-preview-tip=Counts the group and answers what it covers, what goes unclaimed, which machines would idle and what one hand on each position is worth -- without freezing or laying anything.
bus-lay=Lay the group
form-bus-lay-tip=Freezes the card and places its ghosts into the box you drew, wires and controllers included: the wires are drawn again when the entities arrive, because a ghost holds neither a wire nor a setting.
