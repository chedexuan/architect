; Everything the player reads in the window. The values a menu shows are the game's own translations
; (`[item-name]`, `[entity-name]`) with the prototype id beside them, so this file holds only this mod's
; sentences; `dev/locale_check.js` fails when a key used in the Lua is missing here or in zh-CN.
;
; This file is the English the panel has always spoken, moved out of the code rather than rewritten:
; `dev/lines.js` substitutes these values back into the flattened keys a headless run reads, so the
; suites keep asserting on the sentence a player sees while the Lua holds nothing but keys. Changing a
; value here changes what those assertions match.
