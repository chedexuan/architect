; 窗口里玩家读到的文字，简体中文。菜单里的物品与机器名用的是游戏自带的翻译（[item-name]、
; [entity-name]），后面再跟一个原型 id，所以这个文件只放本 mod 自己的句子；`dev/locale_check.js`
; 会在 Lua 里用到的键在这里或 en 里缺失时让构建失败。
;
; 键与参数顺序和 en 一致，但句子按中文的读法写：数字和原型 id 是参数，放在句子里哪一处由这个文件
; 决定，代码不管。`__1__` 这类占位符两边的空格也是这里定的。
