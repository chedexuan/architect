n-hm-modules=  这条线的流量是按装了 __1__ 算的 —— 要铺 __2__ 台，模块铺了 0 个：虚影身上装不了，建成真机器后自己补上
n-hm-modules-page=  这一页的台数与每分钟件数是按装了 __1__ 算的 —— 欠 __2__ 个模块，铺了 __3__ 个：虚影装不了模块，建成真机器后要装上
n-hm-rate-self=  这条线的流量退回我们自己算了：helmod 那份是按 __1__ 算的（__3__/分），地上铺的是 __2__（按它的速度是 __4__/分）—— 地上这台装了什么模块我们不知道，不敢拿 X 的数去铺 Y 的线
n-hm-belt-need-named=  helmod 说这条线的产物要 __1__ 条带 → ≤0.5 占一股、再多就整条向上，是 __2__ 条（__3__ 股，档位是你在这一格里点名的 __4__，加成 __6__）；这一条实际铺了 __5__ 行成品带
n-hm-belt-need-auto=  helmod 说这条线的产物要 __1__ 条带 → 向上贴半条是 __2__ 条（__3__ 股，档位 __4__ = 我们按"装得下的最慢一档"挑的，不是同步 helmod 的偏好；加成 __6__）；这一条实际铺了 __5__ 行成品带
n-hm-belt-shared=  成品不另开一行带子：它走进料行里离机器远的那一股，这一条借了 __1__ 股
n-hm-fluid-out=  成品以液体走：__1__ 从机器__2__面那一行管子出去（__3__ 单位/分）