rh-wrong-type=它的类型是 __1__，不是 __2__ 里的任何一种
rh-not-placeable=没有任何物品能放下它
rh-no-category=它跑不了 __1__ 这一类配方
rh-locked=当前势力还没解锁它
# 总线那一排：一组机器覆盖一张名单，三种排法与缺货目标。
form-bus=总线组
form-bus-tip=一条机器组按名单做多种东西（而不是只做一个产品）：每台机器从共用的一根线上取自己的配方。它跟别的卡片一样会冻结，铺进你框好的地里。
form-bus-mode-tip=均分：第 i 台做名单第 i 样，一次把名单铺开。轮流：每台每隔几 tick 重新随机挑一样，随时间铺满名单。缺货：顺序不再由名单决定 —— 每样的数 = 目标数 − 这条线自己出货箱里的存量，哪个架子最空就先做哪个。
bus-split=均分（一次铺开）
bus-rotate=轮流（随时间铺）
bus-shortage=缺货优先（架上还差几件）
form-bus-target=目标数
form-bus-target-tip=只有「缺货优先」读这个：出货箱里已经有这么多件，这条线就不必再做它了。这是个数，不是速率 —— 一般拿"一分钟的产量"当它。
form-bus-each=每样几台
form-bus-each-tip=每个被勾上的候选分几台机器。配比只能按整台要：齿轮两台、铜线一台就是 2:1 的产出；"做这道菜的一半"这种权重，引擎没被测过认不认。
form-bus-cand-tip=配方 __1__
bus-no-candidates=这台机器没有任何「一条带子车道能运」的配方 —— 到机器那一排换一个组装机（或者留着自动、但存档里要有可造的组装机），候选就会出现在下面。
bus-more-hidden=这台机器还能做 __1__ 个别的配方，没列出来 —— 从计划里点名它们，或者把机器的范围收窄。
bus-preview=算一下这组
form-bus-preview-tip=只数这组：覆盖哪几样、哪几样没人做、哪几台会闲着、每个位置上一台值多少 —— 不冻结也不铺。
bus-lay=铺这组
form-bus-lay-tip=把这张卡冻住，按你框的地把虚影铺下去，线和控制器都带上：虚影既不存线也不存设置，所以实体到达之后线还要再画一次。
# 一组总线的账：覆盖哪几样、铺下几组、每个候选值多少。
gb-mode=总线组：方式 __1__，一共 __2__ 台机器
gb-target=缺货目标：每样 __1__ 件，拿这条线自己的 __2__ 个出货箱去称，由 __3__ 个算术组合器相减
gb-box=框 __1__x__2__（__3__）；一组占 __4__x__5__ → 横 __6__ × 竖 __7__ = __8__ 组，余 __9__ 格
gb-covered=__1__：第 __2__ 位，上面 __3__ 台机器
gb-unclaimed=这几样没人做：__1__ —— 这组的手比名单短
gb-idle=这些机器要的位次名单填不上，所以它们不持配方：__1__
gb-rate=__1__：一台 __2__/分，铺下的组合起来 __3__/分
gb-laid=把 __1__ 铺进框里：__2__ 组虚影
gb-ghosts=__1__ 个虚影落在 __2__,__3__，同时画了 __4__ 根线
gb-redraw=这些线等实体到了还得再画一次（虚影既不存线也不存设置）—— 作业 __1__ 会在建成事件上补画，不用再按
m-bus-none-ticked=总线那一排什么都没勾 —— 至少勾一个候选，或者回到「计划」去按单一产品算
m-bus-no-handler=总线这个按钮在这版里没有对应处理
m-bus-machine-not-settable=总线要求机器能被告诉它做什么配方，而 __1__ 在这版里没有"设配方"的接口
bus-machine-not-settable=这台机器不能被告诉它该做什么 —— 熔炉是"面前有什么就炼什么"，线对它说话也没人听。要总线路就选一个组装机。
bus-no-machine=这张存档上没有能放下来的生产机器，所以这一组本来就没法铺 —— 总线这排没有候选可列。

n-cand-over=（比要的多 __1__%）
n-cand-under=（比要的少 __1__%）
f-skipped-ground=  另有 __1__ 格不属于你的东西（矿脉、地皮这类）没带进卡 —— 本来也不该带（共 __2__ 种）
rig-wait=还在跑：约 __1__ 游戏秒后再按一次读结果
verify-tip=真的把这张卡放到地上问引擎能不能站住，验完收掉 —— 所以它会临时占地
why-tip=不新事：把这张卡的声称、实测过没有、窗口多长、以及现在的 lint 一起念出来
power-tip=在台架上量哪种电线杆站得住、够得着，把杆加进这张卡再验一遍
measure-tip=放上试验台真跑一遍：会请求把世界时钟调到 20×（有人连着就保持 1×），跑完按「跑完了吗」看结果
place-tip=在你角色附近找一块空地放下虚影，实体由你自己落
carry-tip=把这张卡的蓝图放进你的手上；手上有东西就只告诉你，不动你拿着的那件
wire-tip=只读，不改任何东西：这张卡的机器建起来之后线接上了几条、哪台机器的控制器被引擎拒了；被拒的那台不会自己再来一次
n-wire=接上 __1__ 条线，还有 __2__ 条没接上；写了 __3__ 个控制器，__4__ 台机器被告知配方（__5__ 台没有配方开关）
n-wire-job=__1__（在 __2__ 上）：__3__/__4__ 条线已接，还有 __5__ 条没接上
n-wire-settled=这一批早就铺完了，这些控制器被引擎拒了：__1__（在 __2__ 上，__3__ 台机器）
n-wire-refused=  __1__：__2__
n-wire-why=__1__ __2__ —— __3__
n-wire-quiet=这张卡没有还没接的线，也没有被拒的控制器
n-dropped-machine=  （不再钉机器：__1__ 做不了 __2__，这一问改由求解器挑机器）
form-rig-read=跑完之后
status-tip=量台架与「上试验台跑」的窗口现在到哪一步了；没跑完的窗口不给速率
save-tip=把这次实测写回那张卡，面板上的「计划值」才变成游戏确认过的数
# helmod 的表 -> 虚影，最短的一条路
helmod=按 helmod 拿到手上
helmod-tip=直接读 helmod 算好的表（走它自己开的跨 mod 接口），每条配方开成一条排好的线（机器、进料带、爪子、输出箱），做成蓝图塞进你手上，蓝图文字同时填进复制框：不建卡片、不校验、不上试验台。铺哪儿你自己拖；「撤回」只拿回本 mod 直接铺到地上的那批
helmod-all-press=全部塞进背包
helmod-all-tip=helmod 每一页做成一张蓝图，全部放进你的背包：手上一次只能拿一张，所以整份计划得放在你能一张张拿出来的地方。被拒的页会点名，不会悄悄跳过
verb-helmod-all=helmod 整份
chat-hmall=architect：__1__ 张蓝图进了背包，__2__ 页被拒
n-hmall-total=交了 __1__ 张蓝图，__2__ 页被拒
n-hmall=  __1__：__2__ 个部件、__3__ 条线，放进__4__
n-hmall-unfed=    __3__ 每单还要吃 __1__ × __2__，这条线一样都没送过来
n-hmall-refused=  __1__：被拒（__2__）
verb-helmod=helmod 的表
chat-helmod=architect：helmod 的表 → 在 __2__ 交了 __1__ 个部件 __3__
n-hm-scoped=只铺 __1__ 这一条线（那页上其余的留在 helmod 里）
n-hm=__6__ 里 __1__ 种机器：在 __3__ 的 __4__,__5__ 铺了 __2__ 个虚影
n-hm-item=  __1__：铺了 __2__ 台（表里要 __3__）
n-hm-skip=  __1__ × __2__ 跳过：__3__
n-hm-refused=  __2__ 那个位置放不下 __1__
n-hm-undo=要拿回来就按「撤回」（栈深 __1__）；台数按 __2__ 取整
m-helmod-not-available=helmod 装上了，但 get_models() 报错了：这个 mod 读的入口是 helmod_interface:get_models()，helmod 2.2 就是这个
m-helmod-no-factory=helmod 的这张表里没有编号 __1__ 的工厂
m-helmod-no-line=helmod 的 __2__ 里没有跑 __1__ 的那条线；它上面有哪几条，答案里列出来了
m-helmod-nothing=这张表里没有可以铺的机器 -- 从 __1__ 什么都没读到
m-helmod-not-installed=这张存档里没有 helmod：`helmod_interface` 没人应答。装上 helmod，或者自己把 plan = { 名字 = 台数 } 传进来
m-helmod-empty=helmod 这张存档里还没有表 -- 打开 helmod，给某个工厂至少一条配方，再按一次（或者直接传 plan = { 名字 = 台数 }）
n-hm-lane=__1__ 一条线：__2__ × __3__ 台，共 __4__ 个部件（带子 __5__、爪子 __6__、箱子 __7__），起点 __8__,__9__
n-hm-unfed=  它每单还要吃 __1__ × __2__，而这条线一样都没送过来 —— 这条线只喂 __3__
n-hm-shape=  这条的形状：__1__ —— 一整排共用带子和两头那两只箱子，不是每台机器配一套
n-hm-fed=  这条带子两股：一股走 __1__、一股走 __2__；机器前那只胳膊两条道都取，所以两种料都进得了机器
n-hm-split=  一条这种带最多喂 __1__ 台，所以这一行拆成了 __2__ 条线（这是第 __3__ 条）
n-hm-nolane=  __1__ 用 __2__ 铺不成一条线（__3__ 台）：__4__ —— 改成散着铺
form-helmod=helmod 工厂
helmod-all=全部一起
helmod-line-word=    一条线：__1__ × __2__ 台（__3__）
helmod-none=__1__
form-helmod-tip=选要铺哪一个 helmod 工厂；「全部一起」就是把每个工厂的机器都装进同一张蓝图
n-hm-copy=蓝图文字（__1__ 字节）已经填进复制框 -- Ctrl+C 就能带走
door-cursor=手上
door-pack=背包
door-string=复制框
n-hm-hand=蓝图已经在你的__2__（__1__ 个部件）-- 想铺哪儿自己拖；「撤回」只拿回本 mod 直接铺到地上的那批
n-hm-short=  引擎只收下 __1__/__2__ 个部件，剩下的装不进蓝图
n-hm-swap=  表里要的是 __1__；这条线铺的是 __2__（__3__ 台）—— 要么点名一台跑得动这配方的机器，要么就接受这个替代
