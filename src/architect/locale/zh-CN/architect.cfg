n-hm-hand=蓝图已经在你的__2__（__1__ 个部件）-- 想铺哪儿自己拖；「撤回」只拿回本 mod 直接铺到地上的那批
n-hm-short=  引擎只收下 __1__/__2__ 个部件，剩下的装不进蓝图
n-hm-signs=  头尾那两块牌带着股道清单：__2__ 块面板里 __1__ 块写上了字（建成之后亮不亮，请你建一次看看）
n-hm-wires=  连线带进蓝图文字里 __1__/__2__ 条（铺到地上的虚影这一路连不了线：2.0 没有脚本连线的方法，那几条要你亲手拉）
n-hm-circuits=  控制行为：这张卡上 __2__ 件带着它，引擎把设置读回来的是其中 __1__ 件
n-hm-circuits-rc=  被告知"配方从线上读"的机器：要 __1__ 台，读回来 __2__ 台
n-hm-swap=  表里要的是 __1__；这条线铺的是 __2__（__3__ 台）—— 要么点名一台跑得动这配方的机器，要么就接受这个替代
n-hm-modules=  这条线的流量是按页上写的 __1__ 折出来的 —— 要铺 __2__ 台。虚影身上装不了模块（2.0 没有那个方法），装这件事本 mod 不管
n-hm-modules-page=  这一页的台数与每分钟件数是按页上写的 __1__ 折出来的（合计 __2__ 个）
n-hm-rate-self=  这条线的流量退回我们自己算了：helmod 那份是按 __1__ 算的（__3__/分），地上铺的是 __2__（按它的速度是 __4__/分）—— 地上这台装了什么模块我们不知道，不敢拿 X 的数去铺 Y 的线
n-hm-belt-need-named=  helmod 说这条线的产物要 __1__ 条带 → ≤0.5 占一股、再多就整条向上，是 __2__ 条（__3__ 股，档位是你在这一格里点名的 __4__，加成 __6__）；这一条实际铺了 __5__ 行成品带
n-hm-belt-need-auto=  helmod 说这条线的产物要 __1__ 条带 → 向上贴半条是 __2__ 条（__3__ 股，档位 __4__ = 我们按"装得下的最慢一档"挑的，不是同步 helmod 的偏好；加成 __6__）；这一条实际铺了 __5__ 行成品带
n-hm-belt-shared=  成品不另开一行带子：它走进料行里离机器远的那一股，这一条借了 __1__ 股
n-hm-fluid-out=  成品以液体走：__1__ 从机器__2__面那一行管子出去（__3__ 单位/分）
