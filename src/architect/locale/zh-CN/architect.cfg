detail-tip=多显示几句技术数（牌子几块带字、连线回读几条、带控制行为的件配了几件）。被拒的页永远都在，不受这一格影响。
auto-refresh-stopped=architect：每秒一次的重读抛错，已经自己停了 -- __1__
detail-hidden=（还有 __1__ 句技术细节，勾上「详细」展开）
style-auto-tip=按这条线的料与台数自己挑一档（挑不到就按名拒，不悄悄换）。
style-stacked-tip=机器排成一行：进料带在一侧、成品带在另一侧，一只箱子也不放。
style-two-row-tip=两排机器面对面，中间那条带子两排共用（成品从这儿走），一只箱子也不放。至少 2 台才成立。
style-fluid-back-tip=这条线喝水：机器后面整行空出来走管道，吃料与吐成品都在另一面，一只箱子也不放。
style-fluid-through-tip=这条线又喝又吐液体：两面各空一行走管道（一面进、一面出），臂站到管道外面那一行，一只箱子也不放。
n-skip-no-entity=计划里点了它的名字，但这个安装上没有这个实体（模块、燃料、品质变体都会这样）
n-skip-no-box=读不到它的占地，所以地上没有一格能放它
