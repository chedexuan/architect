[path]
; __PATH__system-read-data__ is /usr/share/factorio on Linux (the FHS packaging default); it only
; ever meant "the game directory" on the Steam install this file was originally written against.
read-data=__PATH__executable__/../../data
; The one deliberate absolute path here: Factorio has no --write-data flag, only -c/--config, and an
; INI can derive paths relative to the executable only -- which is the game install, not this repo.
write-data=/home/admin/factori/.factorio-data

[general]
locale=en
